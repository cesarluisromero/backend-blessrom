quarkus.application.name=backend-blessrom
quarkus.http.host=127.0.0.1
quarkus.http.port=8080
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:4200,http://localhost:4300
%dev.quarkus.http.cors.methods=GET,HEAD,OPTIONS,POST,PUT,DELETE
%dev.quarkus.http.cors.headers=Content-Type,Authorization,X-Cart-Token,Idempotency-Key
quarkus.smallrye-openapi.info-title=Blessrom API
quarkus.smallrye-openapi.info-description=Catálogo versionado, inventario, carrito, pedidos y pagos en línea o manuales en PEN.
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.username=${DB_USER:blessrom}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=8
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true
blessrom.reservation-minutes=30
blessrom.notifications.enabled=${NOTIFICATIONS_ENABLED:false}
quarkus.mailer.from=${SMTP_FROM:no-reply@blessrom.com}
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.start-tls=${SMTP_START_TLS:REQUIRED}
%prod.quarkus.mailer.mock=false
quarkus.oidc.devservices.enabled=false
%dev.quarkus.oidc.enabled=false
%test.quarkus.oidc.enabled=false
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=blessrom-backend
%prod.quarkus.oidc.application-type=service
%prod.quarkus.oidc.roles.role-claim-path=realm_access/roles
%prod.quarkus.oidc.token.principal-claim=sub
%dev.quarkus.http.auth.basic=true
%dev.quarkus.security.users.embedded.enabled=true
%dev.quarkus.security.users.embedded.plain-text=true
%dev.quarkus.security.users.embedded.users.admin=${BLESSROM_ADMIN_PASSWORD}
%dev.quarkus.security.users.embedded.roles.admin=admin
%test.quarkus.scheduler.enabled=false
%test.quarkus.datasource.jdbc.url=${TEST_DB_URL:jdbc:postgresql://127.0.0.1:55432/blessrom_test}
quarkus.http.limits.max-body-size=3M
blessrom.payments.mercado-pago.enabled=${MERCADO_PAGO_ENABLED:false}
blessrom.payments.mercado-pago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
blessrom.payments.mercado-pago.webhook-secret=${MERCADO_PAGO_WEBHOOK_SECRET:}
blessrom.payments.mercado-pago.store-url=${BLESSROM_STORE_URL:https://blessrom.com}
blessrom.payments.mercado-pago.webhook-url=${MERCADO_PAGO_WEBHOOK_URL:https://api.blessrom.com/api/v1/payments/mercado-pago/webhook}
blessrom.ai.enabled=${AI_ENABLED:false}
blessrom.ai.search.enabled=${AI_SEARCH_ENABLED:false}
blessrom.ai.api-key=${OPENAI_API_KEY:}
blessrom.ai.model=${OPENAI_MODEL:gpt-5-mini}
blessrom.ai.endpoint=${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}
blessrom.ai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
blessrom.ai.embedding-dimensions=${OPENAI_EMBEDDING_DIMENSIONS:1536}
blessrom.ai.embeddings-endpoint=${OPENAI_EMBEDDINGS_URL:https://api.openai.com/v1/embeddings}
blessrom.ai.embedding-sync-every=${OPENAI_EMBEDDING_SYNC_EVERY:10m}
blessrom.media.r2.enabled=${R2_ENABLED:false}
blessrom.media.r2.endpoint=${R2_ENDPOINT:https://invalid.r2.cloudflarestorage.com}
blessrom.media.r2.bucket=${R2_BUCKET:blessrom-media-production}
blessrom.media.r2.access-key-id=${R2_ACCESS_KEY_ID:}
blessrom.media.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
blessrom.media.public-base-url=${MEDIA_PUBLIC_BASE_URL:https://media.blessrom.com}
blessrom.media.upload-expiry-seconds=${R2_UPLOAD_EXPIRY_SECONDS:600}
blessrom.media.cache-purge.enabled=${CLOUDFLARE_CACHE_PURGE_ENABLED:false}
blessrom.media.cache-purge.zone-id=${CLOUDFLARE_ZONE_ID:}
blessrom.media.cache-purge.token=${CLOUDFLARE_CACHE_PURGE_TOKEN:}
blessrom.ai.enabled=${AI_STUDIO_ENABLED:false}
blessrom.ai.worker-url=${AI_WORKER_URL:http://ai-image-worker:8090}
blessrom.ai.worker-token=${AI_WORKER_TOKEN:}
blessrom.ai.poll-interval=${AI_POLL_INTERVAL:5s}

